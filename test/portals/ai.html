<!doctype html>
<html><head><meta charset="utf-8"><title>Apply — Orbit</title></head>
<body>
<h1>Backend Engineer</h1>
<form id="application_form">
  <label for="ai-first">First name</label><input type="text" id="ai-first" name="first_name">
  <label for="ai-email">Email</label><input type="email" id="ai-email" name="email">

  <div class="q">
    <label for="ai-why">Why are you interested in joining Orbit?</label>
    <textarea id="ai-why" name="custom_question_8842_b17c" rows="4" placeholder="A few sentences is plenty"></textarea>
  </div>

  <div class="q">
    <label for="ai-proud">Describe a project you are proud of.</label>
    <textarea id="ai-proud" name="custom_question_9931_ff20" rows="4"></textarea>
  </div>

  <div class="q">
    <label for="ai-tooling">Which of these have you used in production?</label>
    <select id="ai-tooling" name="custom_question_4410_a900">
      <option value="">Select…</option>
      <option>Kubernetes</option><option>Nomad</option><option>Mesos</option><option>None of these</option>
    </select>
  </div>

  <div class="q">
    <label for="ai-onsite">How many days per week would you come to the office?</label>
    <select id="ai-onsite" name="custom_question_7712_cc31">
      <option value="">Select…</option>
      <option>0</option><option>1</option><option>2</option><option>3</option><option>5</option>
    </select>
  </div>

  <button type="submit">Submit</button>
</form>
</body></html>
