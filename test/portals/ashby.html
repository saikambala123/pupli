<!doctype html>
<html><head><meta charset="utf-8"><title>Senior SRE @ Superhuman | Ashby</title></head>
<body>
<div class="ashby-application-form-container">
<h1>Senior SRE</h1>
<form class="ApplicationForm">
  <div class="_fieldEntry_hkyf8_29">
    <label class="_label_hkyf8_1" for="ab-name">Name<span>*</span></label>
    <input type="text" id="ab-name" name="_systemfield_name">
  </div>
  <div class="_fieldEntry_hkyf8_29">
    <label class="_label_hkyf8_1" for="ab-email">Email<span>*</span></label>
    <input type="email" id="ab-email" name="_systemfield_email">
  </div>
  <div class="_fieldEntry_hkyf8_29">
    <label class="_label_hkyf8_1" for="ab-phone">Phone</label>
    <input type="tel" id="ab-phone" name="_systemfield_phone">
  </div>
  <div class="_fieldEntry_hkyf8_29">
    <label class="_label_hkyf8_1" for="ab-resume">Resume<span>*</span></label>
    <input type="file" id="ab-resume" name="_systemfield_resume">
  </div>
  <div class="_fieldEntry_hkyf8_29">
    <label class="_label_hkyf8_1" for="ab-linkedin">LinkedIn</label>
    <input type="text" id="ab-linkedin" name="1a2b3c4d-5e6f-7890-abcd-ef1234567890">
  </div>
  <div class="_fieldEntry_hkyf8_29">
    <label class="_label_hkyf8_1" for="ab-loc">Location<span>*</span></label>
    <input type="text" id="ab-loc" name="_systemfield_location">
  </div>

  <!-- Ashby renders single-choice questions as a group of styled radios whose
       question text sits in a div above them, not in a legend. -->
  <div class="_fieldEntry_hkyf8_29">
    <div class="_label_hkyf8_1">Are you authorized to work in the United States?<span>*</span></div>
    <div class="_container_101oc_1">
      <label><input type="radio" name="edb0c17a-447a-b4c5-8a5afa5ba1a9" value="Yes"> Yes</label>
      <label><input type="radio" name="edb0c17a-447a-b4c5-8a5afa5ba1a9" value="No"> No</label>
    </div>
  </div>
  <div class="_fieldEntry_hkyf8_29">
    <div class="_label_hkyf8_1">Will you now or in the future require visa sponsorship?<span>*</span></div>
    <div class="_container_101oc_1">
      <label><input type="radio" name="bb91f2e1-9c32-4f77-91aa-0d4f5a7c1e33" value="Yes"> Yes</label>
      <label><input type="radio" name="bb91f2e1-9c32-4f77-91aa-0d4f5a7c1e33" value="No"> No</label>
    </div>
  </div>

  <div class="_fieldEntry_hkyf8_29">
    <div class="_label_hkyf8_1">How did you hear about this role?</div>
    <select id="ab-src" name="c71d9a55-2f18-4a01-bb8d-9e0c1f2a3b44">
      <option value="">Select an option</option>
      <option>LinkedIn</option><option>Twitter</option><option>A friend</option><option>Other</option>
    </select>
  </div>

  <div class="_fieldEntry_hkyf8_29">
    <div class="_label_hkyf8_1">What's your notice period?</div>
    <input type="text" id="ab-notice" name="d2e3f4a5-6b7c-8d9e-0f1a-2b3c4d5e6f70">
  </div>

  <h3>Demographic Questions</h3>
  <div class="_fieldEntry_hkyf8_29">
    <div class="_label_hkyf8_1">Gender</div>
    <select id="ab-gender" name="f0e1d2c3-b4a5-9687-7869-5a4b3c2d1e0f">
      <option value="">Select an option</option>
      <option>Man</option><option>Woman</option><option>Non-binary</option><option>I prefer not to say</option>
    </select>
  </div>
  <button type="submit">Submit Application</button>
</form>
</div>
</body></html>
