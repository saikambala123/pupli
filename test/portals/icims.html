<!doctype html>
<html><head><meta charset="utf-8"><title>Apply - iCIMS</title></head>
<body>
<div class="iCIMS_MainWrapper">
<h1 class="iCIMS_Header">Platform Engineer</h1>
<form id="jobForm" method="post">
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="fn">First Name</label></div>
    <input type="text" id="fn" name="firstname">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="ln">Last Name</label></div>
    <input type="text" id="ln" name="lastname">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="em">Email Address</label></div>
    <input type="text" id="em" name="email">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="hp">Home Phone</label></div>
    <input type="text" id="hp" name="homephone">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="mp">Mobile Phone</label></div>
    <input type="text" id="mp" name="mobilephone">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="ad">Street Address</label></div>
    <input type="text" id="ad" name="addr1">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="ad2">Address Line 2</label></div>
    <input type="text" id="ad2" name="addr2">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="ct">City</label></div>
    <input type="text" id="ct" name="city">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="st">State</label></div>
    <input type="text" id="st" name="state">
  </div>
  <div class="iCIMS_TableRow">
    <div class="iCIMS_InfoMsg"><label for="zp">Postal Code</label></div>
    <input type="text" id="zp" name="zip">
  </div>

  <h3>Work Experience (1)</h3>
  <div class="iCIMS_TableRow"><label for="e1c">Employer</label><input type="text" id="e1c" name="emp1"></div>
  <div class="iCIMS_TableRow"><label for="e1t">Job Title</label><input type="text" id="e1t" name="tit1"></div>
  <div class="iCIMS_TableRow"><label for="e1s">Start Date</label><input type="text" id="e1s" name="st1" placeholder="MM/YYYY"></div>
  <div class="iCIMS_TableRow"><label for="e1e">End Date</label><input type="text" id="e1e" name="en1" placeholder="MM/YYYY"></div>

  <h3>Work Experience (2)</h3>
  <div class="iCIMS_TableRow"><label for="e2c">Employer</label><input type="text" id="e2c" name="emp2"></div>
  <div class="iCIMS_TableRow"><label for="e2t">Job Title</label><input type="text" id="e2t" name="tit2"></div>
  <div class="iCIMS_TableRow"><label for="e2s">Start Date</label><input type="text" id="e2s" name="st2" placeholder="MM/YYYY"></div>
  <div class="iCIMS_TableRow"><label for="e2e">End Date</label><input type="text" id="e2e" name="en2" placeholder="MM/YYYY"></div>

  <h3>Education</h3>
  <div class="iCIMS_TableRow"><label for="sc">School Name</label><input type="text" id="sc" name="school"></div>
  <div class="iCIMS_TableRow"><label for="dg">Degree Earned</label>
    <select id="dg" name="degree"><option value="">--</option><option>Associate's Degree</option><option>Bachelor's Degree</option><option>Master's Degree</option></select></div>
  <div class="iCIMS_TableRow"><label for="mj">Major / Field of Study</label><input type="text" id="mj" name="major"></div>

  <h3>Additional Information</h3>
  <div class="iCIMS_TableRow"><label for="wa">Are you legally authorized to work in the United States?</label>
    <select id="wa" name="workauth"><option value="">--</option><option>Yes</option><option>No</option></select></div>
  <div class="iCIMS_TableRow"><label for="sp">Will you now or in the future require sponsorship?</label>
    <select id="sp" name="sponsor"><option value="">--</option><option>Yes</option><option>No</option></select></div>
  <div class="iCIMS_TableRow"><label for="rl">Are you willing to relocate?</label>
    <select id="rl" name="reloc"><option value="">--</option><option>Yes</option><option>No</option></select></div>
  <div class="iCIMS_TableRow"><label for="sal">Desired Salary</label><input type="text" id="sal" name="salary"></div>
  <div class="iCIMS_TableRow"><label for="src">Source — how did you hear about us?</label>
    <select id="src" name="source"><option value="">--</option><option>LinkedIn</option><option>Indeed</option><option>Referral</option></select></div>
  <input type="submit" id="quickApplyBtn" value="Submit">
</form>
</div>
</body></html>
