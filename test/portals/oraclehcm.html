<!doctype html>
<html><head><meta charset="utf-8"><title>Oracle Recruiting — Apply</title></head>
<body>
<div role="main">
<h1>Security Engineer</h1>
<form>
  <!-- Oracle Recruiting: floating labels, four address lines, and a set of
       boxes most applicants have no value for. -->
  <div><label for="or-title">Title</label><input type="text" id="or-title"></div>
  <div><label for="or-first">First Name</label><input type="text" id="or-first"></div>
  <div><label for="or-mid">Middle Name</label><input type="text" id="or-mid"></div>
  <div><label for="or-last">Last Name</label><input type="text" id="or-last"></div>
  <div><label for="or-last2">Second Last Name</label><input type="text" id="or-last2"></div>
  <div><label for="or-suffix">Suffix</label><input type="text" id="or-suffix"></div>
  <div><label for="or-email">Email</label><input type="text" id="or-email"></div>
  <div><label for="or-cc">Country Phone Code</label>
    <select id="or-cc"><option value="">Select</option><option>+1</option><option>+44</option><option>+91</option></select></div>
  <div><label for="or-phone">Contact Number</label><input type="text" id="or-phone"></div>
  <div><label for="or-ext">Extension</label><input type="text" id="or-ext"></div>

  <h3>Address</h3>
  <div><label for="or-country">Country/Region</label>
    <select id="or-country"><option value="">Select</option><option>India</option><option>United Kingdom</option><option>United States</option></select></div>
  <div><label for="or-a1">Address Line 1</label><input type="text" id="or-a1"></div>
  <div><label for="or-a2">Address Line 2</label><input type="text" id="or-a2"></div>
  <div><label for="or-a3">Address Line 3</label><input type="text" id="or-a3"></div>
  <div><label for="or-a4">Address Line 4</label><input type="text" id="or-a4"></div>
  <div><label for="or-city">City</label><input type="text" id="or-city"></div>
  <div><label for="or-county">County</label><input type="text" id="or-county"></div>
  <div><label for="or-state">State</label>
    <select id="or-state"><option value="">Select</option><option>California</option><option>North Carolina</option></select></div>
  <div><label for="or-zip">Postal Code</label><input type="text" id="or-zip"></div>
  <div><label for="or-taxd">Tax District</label><input type="text" id="or-taxd"></div>

  <h3>Experience</h3>
  <div><label for="or-emp">Employer</label><input type="text" id="or-emp"></div>
  <div><label for="or-job">Job Title</label><input type="text" id="or-job"></div>
  <div><label for="or-cur">I currently work here</label><input type="checkbox" id="or-cur"></div>

  <h3>Questionnaire</h3>
  <div><label for="or-auth">Are you legally entitled to work in the country of the job you are applying for?</label>
    <select id="or-auth"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
  <div><label for="or-spon">Will you require immigration sponsorship?</label>
    <select id="or-spon"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
  <div><label for="or-src">Referral Source</label>
    <select id="or-src"><option value="">Select</option><option>LinkedIn</option><option>Careers Site</option><option>Employee</option></select></div>
  <div><label for="or-empid">Employee ID (if applicable)</label><input type="text" id="or-empid"></div>
  <button type="submit" data-automation-id="submit">Submit</button>
</form>
</div>
</body></html>
