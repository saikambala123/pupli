<script>
/* ---------------------------------------------------------------------------
 * Workday dropdown behaviour, reproduced:
 *  - the button opens a <ul role="listbox"> portalled to the end of <body>;
 *  - picking an option paints it onto the button, sets the button's value to an
 *    opaque id and rewrites aria-label to "<question> <choice> Required";
 *  - `data-followup` questions reveal a checkbox group when answered Yes.
 * A counter records how many times the OS file chooser would have opened.
 * ------------------------------------------------------------------------- */
window.__filePickerOpened = 0;
document.getElementById("select-files").addEventListener("click", () => {
  window.__filePickerOpened++;
});
document.getElementById("resume-input").addEventListener("click", (e) => {
  window.__filePickerOpened++;
  e.preventDefault();
});

let openMenu = null;
function closeMenus() {
  if (openMenu) { openMenu.menu.remove(); openMenu.btn.setAttribute("aria-expanded", "false"); openMenu = null; }
}
function questionOf(btn) {
  if (btn.dataset.question) return btn.dataset.question;
  const label = document.querySelector(`label[for="${btn.id}"]`);
  const text = (label ? label.textContent : "").replace(/\*/g, "").replace(/\s+/g, " ").trim();
  return (btn.dataset.question = text);
}
function wire(btn) {
  questionOf(btn);
  btn.addEventListener("click", () => {
    const wasOpen = openMenu && openMenu.btn === btn;
    closeMenus();
    if (wasOpen) return;
    const menu = document.createElement("ul");
    menu.setAttribute("role", "listbox");
    menu.id = btn.id + "-listbox";
    btn.dataset.options.split("|").forEach((text, i) => {
      const li = document.createElement("li");
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", String(btn.textContent.trim() === text));
      li.dataset.value = `${btn.name}-${i}`;
      const div = document.createElement("div");
      div.textContent = text;
      li.appendChild(div);
      li.addEventListener("click", () => choose(btn, text, i));
      menu.appendChild(li);
    });
    const r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + window.scrollY) + "px";
    menu.style.left = (r.left + window.scrollX) + "px";
    menu.style.width = r.width + "px";
    document.body.appendChild(menu);
    btn.setAttribute("aria-expanded", "true");
    openMenu = { btn, menu };
  });
}
function choose(btn, text, i) {
  btn.textContent = text;
  btn.value = `${btn.name}-${i}`;
  btn.setAttribute("aria-label", `${btn.dataset.question} ${text} Required`);
  closeMenus();
  btn.dispatchEvent(new Event("change", { bubbles: true }));
  if (btn.dataset.followup === "agreements") renderAgreements(text === "Yes");
  // Workday's React tree re-renders some controls when their value changes:
  // the element the applicant answered is replaced by a fresh one.
  if (btn.dataset.rerender === "true") {
    setTimeout(() => {
      const fresh = btn.cloneNode(true);
      delete fresh.dataset.question;
      btn.replaceWith(fresh);
      wire(fresh);
    }, 30);
  }
}
function renderAgreements(show) {
  const host = document.getElementById("followup-agreements");
  host.innerHTML = "";
  if (!show) return;
  host.innerHTML = `
    <fieldset data-automation-id="formField-qtype" data-fkit-id="primaryQuestionnaire--4f1c0a9e7d2b100115a3c1e2f7a40013">
      <legend>Please indicate the type of agreement you have signed with a previous employer. Additionally, be prepared to provide a copy for review.<abbr title="required">*</abbr></legend>
      <div><input type="checkbox" id="agr-nc" name="agr-type" value="nc"><label for="agr-nc">Non-competition agreements</label></div>
      <div><input type="checkbox" id="agr-ns" name="agr-type" value="ns"><label for="agr-ns">Non-solicitation agreements</label></div>
      <div><input type="checkbox" id="agr-nd" name="agr-type" value="nd"><label for="agr-nd">Non-disclosure agreements</label></div>
    </fieldset>`;
}
document.querySelectorAll("button.wd").forEach(wire);
document.addEventListener("click", (e) => {
  if (!openMenu) return;
  if (openMenu.btn.contains(e.target) || openMenu.menu.contains(e.target)) return;
  closeMenus();
}, true);
</script>
